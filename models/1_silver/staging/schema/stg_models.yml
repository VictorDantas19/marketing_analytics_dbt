version: 2

models:

  - name: stg_events
    description: >
      Staging model that standardizes user interaction events generated across the digital acquisition and engagement funnel 
      (e.g., views, clicks, sessions, experiments). It supports funnel conversion analysis, behavioral analytics, and marketing attribution.
    columns:
      - name: event_id
        data_type: string
        description: >
          Unique identifier for each event recorded in the platform.
        tests:
          - not_null
          - unique

      - name: customer_id
        data_type: string
        description: >
          Unique identifier of the customer who generated the event, enabling linkage between behavioral interactions and customer
          or revenue data.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: campaign_id_clean
        data_type: string
        description: >
          Identifier of the campaign associated with the event after data standardization and cleaning processes.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id


  - name: stg_transactions
    description: >
      Staging model that standardizes customer transactions, including purchase information, product references, revenue,
      and campaign attribution. It supports revenue analysis, average order value, LTV, and campaign performance evaluation.
    columns:
      - name: transaction_id
        data_type: string
        description: >
          Unique identifier for each customer transaction.
        tests:
          - not_null
          - unique

      - name: customer_id
        data_type: string
        description: >
          Identifier of the customer responsible for the transaction, enabling linkage between purchases and customer acquisition data.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: campaign_id_clean
        data_type: string
        description: >
          Identifier of the marketing campaign associated with the transaction after cleaning and standardization.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id


  - name: stg_products
    description: >
      Staging model that standardizes product data, including category, brand, base price, and positioning attributes.
      It serves as the product dimension for revenue and sales mix analysis.

    columns:
      - name: product_id
        data_type: string
        description: >
          Unique identifier for each product.
        tests:
          - not_null
          - unique


  - name: stg_customers
    description: >
      Staging model that standardizes customer master data, including signup attributes, country, demographics,
      loyalty segmentation and initial acquisition channel.

    columns:
      - name: customer_id
        data_type: string
        description: >
          Unique identifier for each registered customer.
        tests:
          - not_null
          - unique


  - name: stg_campaigns
    description: >
      Staging model that standardizes marketing campaign data used for customer acquisition and engagement, including channel,
      campaign objective, and target segment.

    columns:
      - name: campaign_id
        data_type: string
        description: >
          Unique identifier for each marketing campaign.
        tests:
          - not_null
          - unique
