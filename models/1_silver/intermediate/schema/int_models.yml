version: 2

models:
  
  - name: int_attribution_last_click_30d
    description: >
      This intermediate model applies the last-click attribution rule with a 30-day window.
      It links each valid transaction to the most recent marketing event generated by the same customer within the 30 days prior to the transaction date.
    columns:
      - name: transaction_id
        data_type: string
        description: >
          Unique identifier of the transaction being attributed to a marketing campaign.
        tests:
          - not_null
          - unique

      - name: campaign_id_30d
        data_type: string
        description: >
          Identifier of the campaign associated with the transaction according to the last-click attribution rule within the previous 30 days.
        tests:
          - not_null
  

  - name: int_customer_enriched
    description: >
      This intermediate model enriches the customer dataset with behavioral and lifecycle attributes derived from transactions.
    columns:
      - name: customer_id
        data_type: string
        description: >
          Unique identifier of the customer used to link customer lifecycle information with transaction and campaign data.
        tests:
          - not_null
          - unique
  

  - name: int_transactions_enriched
    description: >
      This intermediate model enriches the transaction dataset by combining transaction data with customer lifecycle attributes.
    columns:
      - name: transaction_id
        data_type: string
        description: >
          Unique identifier of the transaction.
        tests:
          - not_null
          - unique
  

  - name: int_valid_transaction
    description: >
      This intermediate model filters transactions to keep only records considered valid for revenue analysis.
    columns:
      - name: transaction_id
        data_type: string
        description: >
          Unique identifier of a valid transaction used in revenue analysis.
        tests:
          - not_null
          - unique