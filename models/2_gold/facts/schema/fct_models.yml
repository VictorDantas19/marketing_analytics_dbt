version: 2

models:
  
  - name: fact_cohort_monthly
    description: >
      This fact table stores monthly cohort metrics used to analyze customer retention over time.
      Customers are grouped by the month of their first purchase (cohort_month), and their activity is tracked across the following months.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cohort_month
              - months_since_first_purchase

    columns:
      - name: months_since_first_purchase
        data_type: string
        description: >
          Number of months elapsed since the customer's first purchase. This value is used to measure retention progression within each cohort.
      - name: cohort_month
        data_type: string
        description: >
          Month of the customer's first purchase, used to group customers
          into acquisition cohorts for retention analysis.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fact_events
    description: >
      This fact table stores all behavioral events generated by users during their interaction with the platform.
    columns:
      - name: event_id
        data_type: string
        description: >
          Unique identifier for each recorded user event.
        tests:
          - not_null
          - unique
        
      - name: customer_id
        data_type: string
        description: >
          Identifier of the customer associated with the event, allowing behavioral analysis at the customer level.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
        
      - name: campaign_id
        data_type: string
        description: >
          Identifier of the marketing campaign associated with the event. Enables campaign performance and attribution analysis.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_id
        
      - name: product_id
        data_type: string
        description: >
          Identifier of the product associated with the event interaction.
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

      - name: date
        data_type: string
        description: >
          Date when the event occurred.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day



  - name: fact_funnel_daily
    description: >
      This fact table aggregates user events into daily funnel metrics by campaign.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_day
              - campaign_id

    columns:
      - name: date_day
        data_type: string
        description: >
          Date representing the aggregation level of the funnel metrics.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      
      - name: campaign_id
        data_type: string
        description: >
          Identifier of the campaign associated with the funnel metrics.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_id

  - name: fact_transactions
    description: >
      This fact table stores all valid customer transactions used for revenue analysis.
    columns:
      - name: transaction_id
        data_type: string
        description: >
          Unique identifier of the transaction.
        tests:
          - not_null
          - unique

      - name: customer_id
        data_type: string
        description: >
          Identifier of the customer responsible for the transaction.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
        
      - name: campaign_id
        data_type: string
        description: >
          Identifier of the marketing campaign attributed to the transaction.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_id
        
      - name: product_id
        data_type: string
        description: >
          Identifier of the product purchased in the transaction.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

      - name: date
        data_type: string
        description: >
          Date when the transaction occurred.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day