version: 2

models:
  
  - name: dim_date
    description: >
      This dimension table stores the complete calendar used across the analytics layer of the project.
      It provides standardized date attributes such as day, month, and year to support time-based analysis.
    columns:
      - name: date_sk
        data_type: string
        description: >
          Surrogate key representing the unique date identifier used to join fact tables with the date dimension.
        tests:
          - not_null
          - unique

  - name: dim_campaign
    description: >
      This dimension table stores marketing campaign information used in the customer acquisition process.
    columns:
      - name: campaign_id
        data_type: string
        description: >
          Unique identifier for each marketing campaign.
        tests:
          - not_null
          - unique

  - name: dim_product
    description: >
      This dimension table contains the product catalog used in the platform.
    columns:
      - name: product_id
        data_type: string
        description: >
          Unique identifier of each product available in the catalog.
        tests:
          - not_null
          - unique

  - name: dim_customer
    description: >
      This dimension table stores customer-level information used for segmentation and lifecycle analysis.
    columns:
      - name: customer_id
        data_type: string
        description: >
          Unique identifier of each registered customer.
        tests:
          - not_null
          - unique
